# Builds and tests the reading list example on each platform with the shared reusable workflows,
# and builds the iOS example app for the simulator.
name: Examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ios-package:
    permissions:
      contents: read
    uses: muhittincamdali/.github/.github/workflows/swift-ci.yml@59e72703c617cfab0c12482c477e706c485ed683 # v1.1.1
    with:
      working-directory: Examples/ios/ReadingList
      platforms: '["iOS","macOS"]'
      scheme: ReadingList
      test-on-simulator: true

  flutter:
    permissions:
      contents: read
    uses: muhittincamdali/.github/.github/workflows/flutter-ci.yml@59e72703c617cfab0c12482c477e706c485ed683 # v1.1.1
    with:
      working-directory: Examples/flutter/reading_list
      coverage: false

  # Not the shared node-ci.yml: it serialises runs per repository and ref, so calling it here and
  # from ci.yml cancels one of the two runs.
  react-native:
    name: react-native / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Examples/react-native/reading-list
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Examples/react-native/reading-list/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  ios-app:
    name: ReadingListApp (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version

      - name: Build
        working-directory: Examples/ios/ReadingListApp
        run: |
          set -o pipefail
          xcodebuild build -project ReadingListApp.xcodeproj -scheme ReadingListApp \
            -destination "generic/platform=iOS Simulator" -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet
