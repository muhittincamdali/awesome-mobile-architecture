# Asks the GitHub API about every repository in data/entries.json and fails when one is archived,
# disabled, deleted, renamed or has had no push for 540 days, or when an entry's manual check is
# more than 365 days old. The table of problems is written to the job summary.
name: Staleness

on:
  schedule:
    - cron: "23 5 * * 1"
  pull_request:
    paths:
      - data/entries.json
  push:
    branches: [main]
    paths:
      - data/entries.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: staleness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    name: Listed repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check
        env:
          # Read-only token; raises the API limit from 60 to 1,000 requests an hour.
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/cli.ts staleness --json staleness.json

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staleness
          path: staleness.json
          if-no-files-found: ignore
          retention-days: 30
