# XcodeGen spec for ReadingListApp.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: ReadingListApp
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
packages:
  ReadingList:
    path: ../ReadingList
targets:
  ReadingListApp:
    type: application
    platform: iOS
    sources: [ReadingListApp]
    dependencies:
      - package: ReadingList
        product: ReadingList
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reading List
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # A SwiftUI App declares its window as a Scene; this key makes the UIScene life cycle,
        # which apps built with the iOS 27 SDK must use, explicit in the generated Info.plist.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  ReadingListApp:
    build:
      targets:
        ReadingListApp: all
    run:
      config: Debug
