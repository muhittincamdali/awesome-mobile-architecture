<style>
:root{--accent:#0071E3;--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--border:#d2d2d7;--code:#f5f5f7}
@media (prefers-color-scheme:dark){:root{--accent:#0A84FF;--bg:#000;--fg:#f5f5f7;--muted:#a1a1a6;--border:#38383a;--code:#1c1c1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{border-bottom:1px solid var(--border)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header .wrap{padding-top:20px;padding-bottom:16px}
.title{font-size:1.4rem;font-weight:700;margin:0}
.title a{color:var(--accent);text-decoration:none}
nav.lang{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9rem}
a{color:var(--accent)}
main{padding-top:24px;padding-bottom:48px;overflow-wrap:anywhere}
h1,h2,h3{line-height:1.25;margin-top:2em}
h2{border-bottom:1px solid var(--border);padding-bottom:.3em}
code,pre{background:var(--code);border-radius:6px;font-size:.9em}
code{padding:.15em .35em}
pre{padding:12px;overflow-x:auto}
pre code{padding:0;background:none}
table{border-collapse:collapse;display:block;overflow-x:auto}
th,td{border:1px solid var(--border);padding:6px 10px}
img{max-width:100%;height:auto}
blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--accent);color:var(--muted)}
footer{border-top:1px solid var(--border);color:var(--muted);font-size:.85rem}
footer .wrap{padding-top:16px;padding-bottom:24px}
</style>
</head>

<header><div class="wrap">
